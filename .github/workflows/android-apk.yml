name: Build OpenVPN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle uitvoerbaar maken
        run: chmod +x gradlew

      - name: APK bouwen
        run: ./gradlew assembleDebug

      - name: APK zoeken
        run: find . -type f -name "*.apk"

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-android-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
