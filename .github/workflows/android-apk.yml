name: Android APK Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android Gradle project
        id: detect_android
        shell: bash
        run: |
          if [ -f ./gradlew ] && find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) | grep -q .; then
            echo "has_android_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android_project=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle Android project found; skipping APK build."
          fi

      - name: Set up JDK 17
        if: steps.detect_android.outputs.has_android_project == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        if: steps.detect_android.outputs.has_android_project == 'true'
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        if: steps.detect_android.outputs.has_android_project == 'true'
        run: chmod +x ./gradlew

      - name: Decode keystore
        if: steps.detect_android.outputs.has_android_project == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.keystore

      - name: Build signed release APK
        if: steps.detect_android.outputs.has_android_project == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Locate APK
        id: locate_apk
        if: steps.detect_android.outputs.has_android_project == 'true'
        run: |
          APK_PATH=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload signed APK artifact
        if: steps.detect_android.outputs.has_android_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Skip APK build when Android project is unavailable
        if: steps.detect_android.outputs.has_android_project != 'true'
        run: echo "Android APK build skipped because this repository does not contain a Gradle Android project."
